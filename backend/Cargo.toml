[package]
name = "c4-fake-navigator-backend"
version = "0.1.0"
edition = "2021"
description = "Backend for control4-fake-navigator: bridges the on-screen driver relay + Control4 REST API to the React UI over websocket."

[dependencies]
control4-navigator-sink-lib = { path = "../lib" }
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.5", features = ["fs", "cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
